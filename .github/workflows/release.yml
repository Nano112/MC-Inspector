name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MC-Inspector
      - uses: actions/checkout@v4
        with:
          repository: Nano112/panel-lib
          ref: c07edcf8558dad5862724ff2297b90db063c62f4 # panel-lib 0.1.4
          path: panel-lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build panel-lib → mavenLocal
        working-directory: panel-lib
        run: ./gradlew publishToMavenLocal -x test --no-daemon
      - name: Build all versions
        working-directory: MC-Inspector
        run: ./gradlew :fabric:buildAllVersions --no-daemon
      - name: Validate tag, installable JARs and checksums
        working-directory: MC-Inspector
        run: python3 scripts/verify-release.py --version "$GITHUB_REF_NAME" --checksums
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          body_path: MC-Inspector/docs/releases/${{ github.ref_name }}.md
          files: |
            MC-Inspector/build/libs/**/*.jar
            MC-Inspector/build/libs/**/SHA256SUMS.txt
