name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MC-Inspector
      - name: Checkout panel-lib (sibling, as in local development)
        uses: actions/checkout@v4
        with:
          repository: Nano112/panel-lib
          ref: c07edcf8558dad5862724ff2297b90db063c62f4 # panel-lib 0.1.4
          path: panel-lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build panel-lib → mavenLocal
        working-directory: panel-lib
        run: ./gradlew publishToMavenLocal -x test --no-daemon
      - name: Build MC-Inspector, every Minecraft version (+ tests)
        working-directory: MC-Inspector
        run: ./gradlew :fabric:buildAllVersions --no-daemon
      - name: Validate installable JARs and generate checksums
        working-directory: MC-Inspector
        run: python3 scripts/verify-release.py --checksums
      - uses: actions/upload-artifact@v4
        with:
          name: mc-inspector-jars
          if-no-files-found: error
          path: |
            MC-Inspector/build/libs/**/*.jar
            MC-Inspector/build/libs/**/SHA256SUMS.txt
